<style>
/* === 與站內其他頁面一致的底色與元件樣式 === */
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.page-body { padding: 20px 16px 48px; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--surface-alt); border-radius: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* 卡片 */
.card {
  background: var(--surface) !important;
  border: 1px solid var(--border);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.card.selected { border-color: #C2571C; box-shadow: 0 0 0 2px #C2571C33; }
.card h3 a { color: var(--text); }
.card h3 a:hover { color: #C2571C; }

/* 視圖切換 */
.view-btn {
  padding: 8px 22px; border-radius: 9999px; font-weight: 600; font-size: 0.85rem;
  font-family: var(--font); cursor: pointer; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); transition: all 0.2s;
}
.view-btn.active {
  background: #C2571C; border-color: #C2571C; color: #fff;
  box-shadow: 0 3px 10px #C2571C55;
}
.view-btn:not(.active):hover { border-color: #C2571C; color: #C2571C; }

.custom-checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: #C2571C; }

/* 篩選區 */
.filter-section {
  background: var(--surface) !important;
  border: 1px solid var(--border) !important;
  backdrop-filter: none;
}
.filter-section label { color: var(--text); }
.filter-section select,
.filter-section input[type="text"] {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border) !important;
  font-family: var(--font);
}
.filter-section select:focus,
.filter-section input[type="text"]:focus { outline: 2px solid #C2571C55; outline-offset: 1px; }

.stats {
  background: var(--surface) !important;
  border: 1px solid var(--border) !important;
  color: var(--muted) !important;
  backdrop-filter: none;
}
.stats span { color: var(--text) !important; }
.stats #selectedCount, .stats #selectedCount { color: #C2571C !important; }

/* 表格 */
table thead tr { background: var(--surface-alt) !important; }
table th { color: var(--text) !important; }
table td { color: var(--text); border-bottom: 1px solid var(--border); }
table tbody tr:hover { background: #FDF0E6 !important; }

/* 匯出區 */
.export-section {
  background: var(--surface) !important;
  border: 1px solid var(--border) !important;
  backdrop-filter: none;
}
.btn-export, .btn-copy {
  font-family: var(--font); font-weight: 600; cursor: pointer; border: none;
  background: #C2571C; color: #fff;
}
.btn-export:hover, .btn-copy:hover { background: #9C4415; }
.result-box { background: var(--surface-alt) !important; }
.result-box pre { color: var(--text) !important; }

/* 頁尾 */
.site-footer { text-align: center; padding: 26px 16px 36px; font-size: 0.76rem; color: var(--muted); }
.site-footer a { color: var(--muted); text-decoration: none; margin: 0 8px; }
.site-footer a:hover { color: #C2571C; text-decoration: underline; }

/* 深色模式下覆寫 Tailwind 的硬編碼色 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .bg-white,
  :root:not([data-theme="light"]) .bg-gray-50 { background-color: var(--surface) !important; }
  :root:not([data-theme="light"]) .text-gray-800,
  :root:not([data-theme="light"]) .text-gray-700 { color: var(--text) !important; }
  :root:not([data-theme="light"]) .text-gray-600,
  :root:not([data-theme="light"]) .text-gray-500,
  :root:not([data-theme="light"]) .text-gray-400 { color: var(--muted) !important; }
  :root:not([data-theme="light"]) .border-gray-100,
  :root:not([data-theme="light"]) .border-gray-200 { border-color: var(--border) !important; }
}

.tag-pill { display: inline-block; padding: 3px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; }

/* 視圖顯示控制 */
.hidden { display: none !important; }
.visible-grid { display: grid !important; }
.visible-table { display: block !important; }

/* 匯出結果框預設收合 */
.result-box { display: none; }
.result-box.show { display: block; }
</style>
</head>

<div class="stats bg-white/90 backdrop-blur rounded-xl px-4 py-3 mb-6 text-sm text-gray-600 shadow-sm border border-gray-100">

<!-- Card View -->
<div class="foods-grid" id="foodsGrid"></div>

<!-- Table View -->

<footer class="site-footer">

        '大阪燒': { background: '#FDEBD8', color: '#96521A' },

        '伴手禮':   { background: '#EFE6F5', color: '#6B3E96' }
    };
    return classes[tag] || { background: '#EFEAE2', color: '#6B6255' };
}

function getPriceClass(price) {
    if (price.includes("¥3,000") || price.includes("¥4,000") || price.includes("¥5,000") || price.includes("¥8,000") || price.includes("¥10,000") || price.includes("¥12,000") || price.includes("¥15,000")) {
        return { background: '#ffcdd2', color: '#c62828', label: '高價位' };
    }
    if (price.includes("¥800") || price.includes("¥900") || price.includes("¥1,000") || price.includes("¥1,200") || price.includes("¥1,500") || price.includes("¥2,000")) {
        return { background: '#fff9c4', color: '#f57f17', label: '中價位' };
    }
    return { background: '#c8e6c9', color: '#2e7d32', label: '平價' };
}

function handleCheckboxChange(name, checked) {
    if (checked) {
        selectedSet.add(name);
    } else {
        selectedSet.delete(name);
    }
    saveSelectedToStorage();
    updateStats();
    filterFoods();
}

function saveSelectedToStorage() {
    const selectedData = foods.filter(f => selectedSet.has(f.name));
    localStorage.setItem('selectedFoods', JSON.stringify(selectedData));
}

function showCardView() {
    currentView = 'card';
    document.getElementById('cardViewBtn').classList.add('active');
    document.getElementById('tableViewBtn').classList.remove('active');
    document.getElementById('foodsGrid').classList.remove('hidden');
    document.getElementById('foodsGrid').classList.add('visible-grid');
    document.getElementById('tableView').classList.add('hidden');
    document.getElementById('tableView').classList.remove('visible-table');
}

function showTableView() {
    currentView = 'table';
    document.getElementById('tableViewBtn').classList.add('active');
    document.getElementById('cardViewBtn').classList.remove('active');
    document.getElementById('foodsGrid').classList.add('hidden');
    document.getElementById('foodsGrid').classList.remove('visible-grid');
    document.getElementById('tableView').classList.remove('hidden');
    document.getElementById('tableView').classList.add('visible-table');
}

function renderCards(filtered) {
    const grid = document.getElementById('foodsGrid');
    grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mb-6';
    grid.innerHTML = filtered.map(f => {
        const isSelected = selectedSet.has(f.name);
        const mapsUrl = f.link || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(f.name);
        const typeArr = f.type || [];
        const tagsHtml = typeArr.map(t => {
            const c = getTagClass(t);
            return '<span class="tag-pill" style="background:' + c.background + '; color:' + c.color + ';">' + t + '</span>';
        }).join('');

        const priceInfo = getPriceClass(f.price);

        return '<div class="card bg-white rounded-2xl p-5 shadow-md' + (isSelected ? ' selected ring-2 ring-orange-500' : '') + '">' +
            '<div class="card-header flex justify-between items-start mb-3">' +
            '<h3 class="text-base font-semibold text-gray-800 mr-2"><a href="' + mapsUrl + '" target="_blank" class="hover:text-orange-600 transition-colors">' + f.name + '</a></h3>' +
            '<input type="checkbox" class="want-to-go custom-checkbox flex-shrink-0" data-name="' + f.name + '"' + (isSelected ? ' checked' : '') + ' onchange="handleCheckboxChange(\'' + f.name.replace(/'/g, "\\'") + '\', this.checked)">' +
            '</div>' +
            '<div class="flex flex-wrap gap-2 mb-3">' + tagsHtml + '</div>' +
            '<p class="text-sm text-gray-600 mb-3 leading-relaxed">' + f.features + '</p>' +
            '<div class="flex flex-wrap gap-2 mb-3">' +
            '<span class="tag-pill" style="background:' + priceInfo.background + '; color:' + priceInfo.color + ';">' + priceInfo.label + '</span>' +
            '</div>' +
            '<div class="text-xs text-gray-500 leading-relaxed space-y-1">' +
            '<div><strong class="text-gray-600">營業：</strong>' + f.hours + '</div>' +
            '<div><strong class="text-gray-600">地址：</strong>' + f.address + '</div>' +
            '</div>' +
            '</div>';
    }).join('');
}

function renderTable(filtered) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = filtered.map(f => {
        const isSelected = selectedSet.has(f.name);
        const mapsUrl = f.link || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(f.name);
        const typeArr = f.type || [];
        const tagsHtml = typeArr.map(t => {
            const c = getTagClass(t);
            return '<span class="tag-pill" style="background:' + c.background + '; color:' + c.color + ';">' + t + '</span>';
        }).join('');

        const priceInfo = getPriceClass(f.price);

        return '<tr class="hover:bg-orange-50 transition-colors' + (isSelected ? ' bg-orange-50' : '') + '">' +
            '<td class="p-3"><input type="checkbox" class="want-to-go custom-checkbox" data-name="' + f.name + '"' + (isSelected ? ' checked' : '') + ' onchange="handleCheckboxChange(\'' + f.name.replace(/'/g, "\\'") + '\', this.checked)"></td>' +
            '<td class="p-3"><a href="' + mapsUrl + '" target="_blank" class="text-orange-700 hover:underline font-medium">' + f.name + '</a></td>' +
            '<td class="p-3"><div class="flex flex-wrap gap-1">' + tagsHtml + '</div></td>' +
            '<td class="p-3 text-sm text-gray-600">' + f.features + '</td>' +
            '<td class="p-3"><span class="tag-pill" style="background:' + priceInfo.background + '; color:' + priceInfo.color + ';">' + f.price + '</span></td>' +
            '<td class="p-3 text-sm text-gray-600">' + f.hours + '</td>' +
            '<td class="p-3 text-sm text-gray-600">' + f.address + '</td>' +
            '<td class="p-3 text-center"><a href="' + mapsUrl + '" target="_blank" class="text-blue-500 hover:text-blue-700 text-lg">📍</a></td>' +
            '</tr>';
    }).join('');
}

function filterFoods() {
    const areaFilter = document.getElementById('areaFilter').value;
    const priceLow = document.getElementById('priceLow').checked;
    const selectedOnly = document.getElementById('selectedOnly').checked;
    const searchText = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase().trim() : '';

    const filtered = foods.filter(f => {
        if (areaFilter !== 'all' && f.area !== areaFilter) return false;
        if (selectedTags.size > 0 && ![...selectedTags].every(t => (f.type || []).includes(t))) return false;
        if (priceLow && !f.price.includes("¥500") && !f.price.includes("¥600") && !f.price.includes("¥700") && !f.price.includes("¥800")) return false;
        if (selectedOnly && !selectedSet.has(f.name)) return false;
        if (searchText) {
            const searchFields = [f.name || '', f.features || '', f.area || '', ...(f.type || [])].join(' ').toLowerCase();
            if (!searchFields.includes(searchText)) return false;
        }
        return true;
    });

    renderCards(filtered);
    renderTable(filtered);
    document.getElementById('totalCount').textContent = filtered.length;
}

function updateStats() {
    document.getElementById('selectedCount').textContent = selectedSet.size;
}

function updateTagOptions() {
    const areaFilter = document.getElementById('areaFilter').value;
    const allTags = [...new Set(foods.filter(f => areaFilter === 'all' || f.area === areaFilter).flatMap(f => f.type || []))];
    const container = document.getElementById('tagFilterContainer');
    container.innerHTML = allTags.map(t => {
        const isSelected = selectedTags.has(t);
        const c = getTagClass(t);
        return '<label style="display: flex; align-items: center; gap: 3px; cursor: pointer; padding: 6px 12px; border-radius: 9999px; transition: all 0.2s; background: ' + (isSelected ? c.background : '#f3f4f6') + '; color: ' + (isSelected ? c.color : '#6b7280') + '; font-size: 13px; font-weight: 500; user-select: none;" class="hover:shadow-md">' +
            '<input type="checkbox" style="display: none;" value="' + t + '"' + (isSelected ? ' checked' : '') + ' onchange="handleTagChange(this)">' +
            t +
            '</label>';
    }).join('');
}

function handleTagChange(checkbox) {
    if (checkbox.checked) {
        selectedTags.add(checkbox.value);
    } else {
        selectedTags.delete(checkbox.value);
    }
    updateTagOptions();
    filterFoods();
}

function exportSelected() {
    const selected = Array.from(selectedSet);
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');
    const selectedData = foods.filter(f => selected.includes(f.name));
    resultText.textContent = JSON.stringify(selectedData, null, 2);
    resultBox.classList.add('show');
}

function copySelected() {
    const selected = Array.from(selectedSet);
    const text = selected.join('\n');
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.btn-copy');
        btn.textContent = '已複製!';
        setTimeout(() => btn.textContent = '複製選擇', 2000);
    });
}

// 注意：areaFilter 的 <select> 已經有 inline onchange，
// 這裡不要再 addEventListener，否則每次切換都會重跑兩遍

// Initialize
function loadSavedSelections() {
    const saved = JSON.parse(localStorage.getItem('selectedFoods') || '[]');
    saved.forEach(f => selectedSet.add(f.name));
}
loadSavedSelections();
updateTagOptions();
showCardView(); // 確保卡片視圖預設為顯示
filterFoods();
</script>
