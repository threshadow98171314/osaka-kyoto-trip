<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大阪・京都景點選擇器</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%); min-height: 100vh; }

/* Custom scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #a1a1a1; }

/* Card animations */
.card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -8px rgba(0,0,0,0.15); }
.card.selected { background: linear-gradient(135deg, #f0fff4 0%, #e8f5e9 100%); }

/* Tag pill style */
.tag-pill { display: inline-block; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 500; transition: all 0.2s; }
.tag-pill:hover { transform: scale(1.05); }

/* View toggle button */
.view-btn { padding: 10px 24px; border-radius: 9999px; font-weight: 500; transition: all 0.2s; }
.view-btn.active { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: white; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4); }
.view-btn:not(.active) { background: white; color: #6b7280; }
.view-btn:not(.active):hover { background: #f9fafb; }

/* Checkbox custom */
.custom-checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: #22c55e; }

/* Filter section */
.filter-section { backdrop-filter: blur(10px); background: rgba(255,255,255,0.9); }

/* Responsive grid */
@media (max-width: 640px) {
  .attractions-grid { grid-template-columns: 1fr !important; }
}

/* View display control */
.hidden { display: none !important; }
.visible-grid { display: grid !important; }
.visible-table { display: block !important; }

/* 匯出結果框：預設收合，按下「匯出已選景點」才展開 */
.result-box { display: none; }
.result-box.show { display: block; }
</style>
</head>

<div class="max-w-7xl mx-auto">
<h1 class="text-2xl md:text-3xl font-bold text-center text-gray-800 mb-6">🌸 大阪・京都之旅 - 景點選擇器</h1>

<div class="view-toggle flex justify-center gap-3 mb-6">

</div>

<div class="filter-section rounded-2xl p-4 mb-6 shadow-sm border border-gray-100">

            <option value="all">全部</option>
            <option value="京都">京都</option>
            <option value="大阪">大阪</option>
            <option value="奈良">奈良</option>
            <option value="關西延伸">關西延伸</option>
        </select>
        </div>
        <div class="filter-group flex items-center gap-2">
            <label class="font-medium text-sm text-gray-700">標籤：</label>
            <div id="tagFilterContainer" class="flex flex-wrap gap-2 max-w-xl"></div>
        </div>
        <div class="filter-group flex items-center gap-2">
            <label class="text-lg">🔍</label>
            <input type="text" id="searchInput" placeholder="搜尋景點..." oninput="filterAttractions()" class="px-3 py-2 border border-gray-200 rounded-lg text-sm w-40 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>
        <div class="filter-group flex items-center gap-2">
            <input type="checkbox" id="freeOnly" onchange="filterAttractions()" class="custom-checkbox">
            <label for="freeOnly" class="text-sm text-gray-700">只顯示免費景點</label>
        </div>
        <div class="filter-group flex items-center gap-2">
            <input type="checkbox" id="selectedOnly" onchange="filterAttractions()" class="custom-checkbox">
            <label for="selectedOnly" class="text-sm text-gray-700">只顯示已選</label>
        </div>
    </div>
</div>

<div class="stats bg-white/90 backdrop-blur rounded-xl px-4 py-3 mb-6 text-sm text-gray-600 shadow-sm border border-gray-100">
    共 <span id="totalCount" class="font-bold text-gray-800">0</span> 個景點，已選擇 <span id="selectedCount" class="font-bold text-green-600">0</span> 個
</div>

<!-- Card View -->
<div class="attractions-grid" id="cardGrid"></div>

<!-- Table View -->
<div class="attractions-table" id="tableView">
    <div class="overflow-x-auto">
    <table class="w-full">
        <thead>
            <tr class="bg-gradient-to-r from-gray-100 to-gray-50">
                <th class="w-12 p-3"></th>
                <th class="p-3 text-left text-sm font-semibold text-gray-700">景點名稱</th>
                <th class="p-3 text-left text-sm font-semibold text-gray-700">標籤</th>
                <th class="p-3 text-left text-sm font-semibold text-gray-700">特色</th>
                <th class="p-3 text-left text-sm font-semibold text-gray-700">票價</th>
                <th class="p-3 text-left text-sm font-semibold text-gray-700">停留</th>
                <th class="p-3 text-left text-sm font-semibold text-gray-700">開放時間</th>
                <th class="p-3 text-left text-sm font-semibold text-gray-700">交通</th>
                <th class="w-14 p-3 text-center text-sm font-semibold text-gray-700">地圖</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    </div>
</div>

<div class="export-section mt-8 bg-white/90 backdrop-blur rounded-2xl p-6 shadow-lg border border-gray-100 text-center">
    <button class="btn-export px-6 py-3 rounded-xl text-white font-medium mr-3 hover:shadow-lg transition-all" onclick="exportSelected()">📥 匯出已選景點</button>
    <button class="btn-copy px-6 py-3 rounded-xl text-white font-medium hover:shadow-lg transition-all" onclick="copySelected()">📋 複製選擇</button>
    <div class="result-box mt-4 p-4 bg-gray-50 rounded-xl text-left max-h-48 overflow-y-auto" id="resultBox"><pre id="resultText" class="text-sm text-gray-700 whitespace-pre-wrap"></pre></div>
</div>

<footer class="text-center mt-8 text-gray-400 text-sm">
    <a href="candidates.html" class="text-green-600 hover:underline mr-4">📋 候選清單</a>
    <a href="foods.html" class="text-orange-500 hover:underline">→ 前往美食選擇器</a>
</footer>
</div>

    localStorage.setItem('selectedAttractions', JSON.stringify(selectedData));
}

function showCardView() {
    currentView = 'card';
    document.getElementById('cardViewBtn').classList.add('active');
    document.getElementById('tableViewBtn').classList.remove('active');
    document.getElementById('cardGrid').classList.remove('hidden');
    document.getElementById('cardGrid').classList.add('visible-grid');
    document.getElementById('tableView').classList.add('hidden');
    document.getElementById('tableView').classList.remove('visible-table');
}

function showTableView() {
    currentView = 'table';
    document.getElementById('tableViewBtn').classList.add('active');
    document.getElementById('cardViewBtn').classList.remove('active');
    document.getElementById('cardGrid').classList.add('hidden');
    document.getElementById('cardGrid').classList.remove('visible-grid');
    document.getElementById('tableView').classList.remove('hidden');
    document.getElementById('tableView').classList.add('visible-table');
}

function renderCards(filtered) {
    const grid = document.getElementById('cardGrid');
    // Only update content, don't touch className (visibility controlled by show/hide functions)
    grid.innerHTML = filtered.map(a => {
        const isSelected = selectedSet.has(a.name);
        const priceClass = isFree(a.price) ? 'free' : 'price';
        const mapsUrl = a.link ? a.link : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a.name + ' ' + a.city);
        const tagsArr = a.tags || [];
        const tagsHtml = tagsArr.map(t => {
            const c = getTagClass(t);
            return '<span class="tag-pill" style="background:' + c.background + '; color:' + c.color + ';">' + t + '</span>';
        }).join('');

        return '<div class="card bg-white rounded-2xl p-5 shadow-md' + (isSelected ? ' selected ring-2 ring-green-500' : '') + '" data-city="' + a.city + '" data-tags="' + tagsArr.join(',') + '">' +
            '<div class="card-header flex justify-between items-start mb-3">' +
            '<h3 class="text-base font-semibold text-gray-800 mr-2"><a href="' + mapsUrl + '" target="_blank" class="hover:text-green-600 transition-colors">' + a.name + '</a></h3>' +
            '<input type="checkbox" class="want-to-go custom-checkbox flex-shrink-0" data-name="' + a.name + '"' + (isSelected ? ' checked' : '') + ' onchange="handleCheckboxChange(\'' + a.name.replace(/'/g, "\\'") + '\', this.checked)">' +
            '</div>' +
            '<div class="flex flex-wrap gap-2 mb-3">' + tagsHtml + '</div>' +
            '<p class="text-sm text-gray-600 mb-3 leading-relaxed">' + (a.features || '') + '</p>' +
            '<div class="text-xs text-gray-500 leading-relaxed space-y-1">' +
            (a.duration ? '<div><strong class="text-gray-600">停留：</strong>' + a.duration + '</div>' : '') +
            (a.hours ? '<div><strong class="text-gray-600">時間：</strong>' + a.hours + '</div>' : '') +
            (a.transport ? '<div><strong class="text-gray-600">交通：</strong>' + a.transport + '</div>' : '') +
            '</div>' +
            '</div>';
    }).join('');
}

function renderTable(filtered) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = filtered.map(a => {
        const isSelected = selectedSet.has(a.name);
        const priceClass = isFree(a.price) ? 'free' : 'price';
        const mapsUrl = a.link ? a.link : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a.name + ' ' + a.city);
        const tagsArr = a.tags || [];
        const tagsHtml = tagsArr.map(t => {
            const c = getTagClass(t);
            return '<span class="tag-pill" style="background:' + c.background + '; color:' + c.color + ';">' + t + '</span>';
        }).join('');

        return '<tr class="hover:bg-green-50 transition-colors' + (isSelected ? ' bg-green-50' : '') + '">' +
            '<td class="p-3"><input type="checkbox" class="want-to-go custom-checkbox" data-name="' + a.name + '"' + (isSelected ? ' checked' : '') + ' onchange="handleCheckboxChange(\'' + a.name.replace(/'/g, "\\'") + '\', this.checked)"></td>' +
            '<td class="p-3"><a href="' + mapsUrl + '" target="_blank" class="text-green-700 hover:underline font-medium">' + a.name + '</a></td>' +
            '<td class="p-3"><div class="flex flex-wrap gap-1">' + tagsHtml + '</div></td>' +
            '<td class="p-3 text-sm text-gray-600">' + (a.features || '-') + '</td>' +
            '<td class="p-3"><span class="tag-pill" style="background:' + (isFree(a.price) ? '#c8e6c9' : '#f5f5f5') + '; color:' + (isFree(a.price) ? '#2e7d32' : '#616161') + ';">' + (a.price || '免費') + '</span></td>' +
            '<td class="p-3 text-sm text-gray-600">' + (a.duration || '-') + '</td>' +
            '<td class="p-3 text-sm text-gray-600">' + (a.hours || '-') + '</td>' +
            '<td class="p-3 text-sm text-gray-600">' + (a.transport || '-') + '</td>' +
            '<td class="p-3 text-center"><a href="' + mapsUrl + '" target="_blank" class="text-blue-500 hover:text-blue-700 text-lg">📍</a></td>' +
            '</tr>';
    }).join('');
}

function filterAttractions() {
    const cityFilter = document.getElementById('cityFilter').value;
    const freeOnly = document.getElementById('freeOnly').checked;
    const selectedOnly = document.getElementById('selectedOnly').checked;
    const searchInput = document.getElementById('searchInput');
    const searchText = searchInput ? searchInput.value.toLowerCase().trim() : '';

    const filtered = attractions.filter(a => {
        if (cityFilter !== 'all' && a.city !== cityFilter) return false;
        if (selectedTags.size > 0 && ![...selectedTags].every(t => (a.tags || []).includes(t))) return false;
        if (freeOnly && !isFree(a.price)) return false;
        if (selectedOnly && !selectedSet.has(a.name)) return false;
        if (searchText) {
            const searchFields = [a.name || '', a.features || '', a.city || '', ...(a.tags || [])].join(' ').toLowerCase();
            if (!searchFields.includes(searchText)) return false;
        }
        return true;
    });

    renderCards(filtered);
    renderTable(filtered);
    document.getElementById('totalCount').textContent = filtered.length;
}

function updateStats() {
    document.getElementById('selectedCount').textContent = selectedSet.size;
}

function updateTagOptions() {
    const cityFilter = document.getElementById('cityFilter').value;
    const allTags = [...new Set(attractions.filter(a => cityFilter === 'all' || a.city === cityFilter).flatMap(a => a.tags || []))];
    const container = document.getElementById('tagFilterContainer');
    container.innerHTML = allTags.map(t => {
        const isSelected = selectedTags.has(t);
        const c = getTagClass(t);
        return '<label style="display: flex; align-items: center; gap: 3px; cursor: pointer; padding: 6px 12px; border-radius: 9999px; transition: all 0.2s; background: ' + (isSelected ? c.background : '#f3f4f6') + '; color: ' + (isSelected ? c.color : '#6b7280') + '; font-size: 13px; font-weight: 500; user-select: none;" class="hover:shadow-md">' +
            '<input type="checkbox" style="display: none;" value="' + t + '"' + (isSelected ? ' checked' : '') + ' onchange="handleTagChange(this)">' +
            t +
            '</label>';
    }).join('');
}

function getTagClass(tag) {
    const classes = {
        'city-kyoto': { background: '#e8f5e9', color: '#2e7d32' },
        'city-osaka': { background: '#fff3e0', color: '#e65100' },
        'city-nara': { background: '#f3e5f5', color: '#7b1fa2' },
        'city-kansai': { background: '#e3f2fd', color: '#1565c0' },
        'free': { background: '#c8e6c9', color: '#2e7d32' },
        '必去': { background: '#ffcdd2', color: '#c62828' },
        '賞楓': { background: '#ffccbc', color: '#bf360c' },
        '賞花': { background: '#f8bbd9', color: '#880e4f' },
        '夜景': { background: '#e1bee7', color: '#6a1b9a' },
        '美食': { background: '#d7f9d0', color: '#2e7d32' },
        '購物': { background: '#fff9c4', color: '#f57f17' },
        '神社寺院': { background: '#ffe0b2', color: '#e65100' },
        '文化體驗': { background: '#b3e5fc', color: '#0277bd' },
        '體驗': { background: '#c8e6c9', color: '#2e7d32' },
        '自然': { background: '#c8e6c9', color: '#1b5e20' },
        '免費': { background: '#c8e6c9', color: '#2e7d32' },
        '收費': { background: '#fff3e0', color: '#e65100' },
        '世界遺產': { background: '#ffecb3', color: '#ff6f00' },
        '主題樂園': { background: '#e1f5fe', color: '#0277bd' },
        'ACG/玩具': { background: '#f3e5f5', color: '#7b1fa2' },
        '溫泉': { background: '#e0f7fa', color: '#00838f' },
        '京都': { background: '#e8f5e9', color: '#2e7d32' },
        '大阪': { background: '#fff3e0', color: '#e65100' },
        '奈良': { background: '#f3e5f5', color: '#7b1fa2' },
        '關西延伸': { background: '#e3f2fd', color: '#1565c0' }
    };
    return classes[tag] || { background: '#f5f5f5', color: '#616161' };
}

function handleTagChange(checkbox) {
    if (checkbox.checked) {
        selectedTags.add(checkbox.value);
    } else {
        selectedTags.delete(checkbox.value);
    }
    updateTagOptions();
    filterAttractions();
}

function exportSelected() {
    const selected = Array.from(selectedSet);
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');
    const selectedData = attractions.filter(a => selected.includes(a.name));
    resultText.textContent = JSON.stringify(selectedData, null, 2);
    resultBox.classList.add('show');
}

function copySelected() {
    const selected = Array.from(selectedSet);
    const text = selected.join('\n');
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.btn-copy');
        btn.textContent = '已複製!';
        setTimeout(() => btn.textContent = '複製選擇', 2000);
    });
}

// 注意：cityFilter 的 <select> 已經有 inline onchange，
// 這裡不要再 addEventListener，否則每次切換都會重跑兩遍

// Initialize
function loadSavedSelections() {
    const saved = JSON.parse(localStorage.getItem('selectedAttractions') || '[]');
    saved.forEach(a => selectedSet.add(a.name));
}
loadSavedSelections();
updateTagOptions();
showCardView(); // 確保卡片視圖預設為顯示
filterAttractions();
</script>
</body>
</html>
