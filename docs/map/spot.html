<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>景點順路地圖｜大阪・京都之旅 2026</title>
<meta name="description" content="單一景點的建議順路與步行路線（OpenStreetMap）">
<meta name="theme-color" content="#B5451B">
<!-- 與行程地圖相同：Leaflet ＋ OpenStreetMap，不需 API key -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --primary: #B5451B;
  --secondary: #4A6FA5;
  --bg: #FAF8F5;
  --surface: #FFFFFF;
  --text: #2C2416;
  --muted: #7A6E5D;
  --border: #E0D8CC;
  --route: #4A6FA5;
  --font: 'Noto Sans TC', 'PingFang TC', 'Hiragino Sans', 'Microsoft JhengHei', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17140F; --surface: #221E17; --text: #EDE6DA; --muted: #A69A88; --border: #3A332A; --route: #8FB3DE; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
.bar h1 { font-size: 1rem; font-weight: 700; margin-right: auto; }
.bar a { font-size: 0.8rem; font-weight: 600; color: var(--secondary); text-decoration: none; }
.bar a:hover { text-decoration: underline; }
body.embed .bar { display: none; }

#map { flex: 1; min-height: 240px; }

/* 編號標記：主色圓點＋白字，和行程地圖的橘色大頭針同一套顏色 */
.stop-pin { width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff;
  font: 800 13px/26px var(--font); text-align: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.stop-pin.is-end { background: var(--secondary); }

.pop-time { font-size: 0.72rem; font-weight: 700; color: var(--primary); }
.pop-name { font-size: 0.92rem; font-weight: 700; margin: 2px 0; }
.pop-ja { font-size: 0.75rem; color: #7A6E5D; }
.pop-desc { font-size: 0.78rem; margin-top: 4px; line-height: 1.5; }
.pop-link { display: inline-block; margin-top: 6px; font-size: 0.75rem; font-weight: 600; color: #4A6FA5; }

/* 嵌在行程表卡片裡時，左上角放日落時間，右上角放「放大」 */
.chip { position: absolute; z-index: 500; top: 8px; font: 700 12px/1 var(--font); padding: 6px 9px; border-radius: 14px;
  background: rgba(255,255,255,.94); color: #2C2416; box-shadow: 0 1px 4px rgba(0,0,0,.25); text-decoration: none; }
.chip.sunset { left: 52px; } /* 讓出左上角的縮放按鈕 */
.chip.expand { right: 8px; color: #4A6FA5; }
body:not(.embed) .chip.expand { display: none; }
.msg { padding: 16px; font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
  <div class="bar">
    <h1 id="title">景點順路地圖</h1>
    <a href="../index.html">← 回首頁</a>
    <a id="dayLink" href="../final/index.html">📅 行程表</a>
    <a id="mapLink" href="./index.html">🗺️ 行程地圖</a>
  </div>
  <div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var id = (params.get('id') || '').replace(/[^a-z0-9-]/gi, '');
  if (params.get('embed') === '1') document.body.classList.add('embed');
  var mapEl = document.getElementById('map');

  function fail(msg) { mapEl.innerHTML = '<p class="msg">' + msg + '</p>'; }
  if (!id) { fail('缺少 ?id= 參數'); return; }
  if (typeof L === 'undefined') { fail('地圖元件載入失敗（可能沒有網路）'); return; }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  fetch('spots/' + id + '.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(draw)
    .catch(function () { fail('找不到這個景點的地圖資料'); });

  function draw(spot) {
    document.title = spot.title + '｜大阪・京都之旅 2026';
    document.getElementById('title').textContent = spot.title + '（Day ' + spot.day + '）';
    document.getElementById('dayLink').href = '../final/index.html#day-' + spot.day;
    document.getElementById('mapLink').href = './index.html?day=' + spot.day;

    var map = L.map(mapEl, { scrollWheelZoom: !document.body.classList.contains('embed') });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors｜步行路徑 OSRM'
    }).addTo(map);

    var route = getComputedStyle(document.documentElement).getPropertyValue('--route').trim() || '#4A6FA5';
    var bounds = [];
    spot.legs.forEach(function (leg) {
      L.polyline(leg.coords, { color: route, weight: 4, opacity: 0.85, dashArray: '2 7', lineCap: 'round' })
        .bindTooltip('步行約 ' + leg.minutes + ' 分（' + leg.meters + ' m）', { sticky: true })
        .addTo(map);
      bounds = bounds.concat(leg.coords);
    });

    var last = spot.stops.length - 1;
    spot.stops.forEach(function (s, i) {
      var label = (i === 0 || i === last) ? (i === 0 ? '起' : '終') : String(i);
      var icon = L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -12],
        html: '<div class="stop-pin' + ((i === 0 || i === last) ? ' is-end' : '') + '">' + label + '</div>' });
      // Google Maps 查詢用日文名稱；執行時用 encodeURIComponent 產生，和 map/index.html 的彈窗寫法相同
      var gmaps = 'https://maps.google.com/maps?q=' + encodeURIComponent(s.ja || s.name);
      L.marker([s.lat, s.lon], { icon: icon, zIndexOffset: 500 }).addTo(map).bindPopup(
        '<div class="pop-time">' + esc(s.time || '') + '</div>'
        + '<div class="pop-name">' + esc(s.name) + '</div>'
        + (s.ja && s.ja !== s.name ? '<div class="pop-ja">' + esc(s.ja) + '</div>' : '')
        + (s.desc ? '<div class="pop-desc">' + esc(s.desc) + '</div>' : '')
        + '<a class="pop-link" href="' + gmaps + '" target="_blank" rel="noopener">在 Google Maps 開啟</a>');
      bounds.push([s.lat, s.lon]);
    });
    map.fitBounds(bounds, { padding: [24, 24] });

    /* 嵌在行程表卡片裡時，那一天還沒顯示前 iframe 的尺寸是 0，Leaflet 會算錯範圍。
       尺寸一改變（切到那一天、手機轉向）就重新量一次、把所有點框進畫面 */
    var lastSize = mapEl.clientWidth + 'x' + mapEl.clientHeight;
    window.addEventListener('resize', function () {
      var size = mapEl.clientWidth + 'x' + mapEl.clientHeight;
      if (size === lastSize || !mapEl.clientWidth || !mapEl.clientHeight) return;
      lastSize = size;
      map.invalidateSize();
      map.fitBounds(bounds, { padding: [24, 24] });
    });

    if (spot.sunset) {
      var chip = document.createElement('div');
      chip.className = 'chip sunset';
      chip.textContent = '🌇 日落 ' + spot.sunset;
      mapEl.appendChild(chip);
    }
    var ex = document.createElement('a');
    ex.className = 'chip expand';
    ex.href = 'spot.html?id=' + encodeURIComponent(id);
    ex.target = '_blank';
    ex.rel = 'noopener';
    ex.textContent = '⤢ 放大';
    mapEl.appendChild(ex);
  }
})();
</script>
</body>
</html>
